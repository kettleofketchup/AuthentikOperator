site_name: AuthentikOperator Documentation
site_description: Documentation for AuthentikOperator
site_dir: public

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Prerequisites: getting-started/prerequisites.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Installation: guide/installation.md
    - Configuration: guide/configuration.md
    - Bootstrap Setup: guide/bootstrap.md
    - Creating OIDCClients: guide/creating-oidc-clients.md
  - Secret Profiles:
    - profiles/index.md
    - Grafana: profiles/grafana.md
    - OpenWebUI: profiles/openwebui.md
    - ArgoCD: profiles/argocd.md
    - Generic: profiles/generic.md
  - Reference:
    - OIDCClient CRD: reference/crd.md
    - Helm Values: reference/helm-values.md
    - Architecture: reference/architecture.md
  - Development:
    - Contributing: development/contributing.md

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: blue
  font:
    text: Roboto
    code: Roboto Mono
  language: en
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tabs.link

plugins:
  - search:
      lang: en
  - include-markdown:
      preserve_includer_indent: true
      dedent: false
      trailing_newlines: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

watch:
  - docs/
  - mkdocs.yml
