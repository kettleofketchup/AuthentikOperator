name: CI

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: manager
          path: bin/

  docker:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Chart.yaml
        id: version
        run: |
          VERSION=$(grep '^appVersion:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Docker image version: ${VERSION}"

      - name: Build and push Docker image
        run: |
          TAG="ghcr.io/kettleofketchup/authentik-operator:${{ steps.version.outputs.version }}"
          VTAG="ghcr.io/kettleofketchup/authentik-operator:v${{ steps.version.outputs.version }}"
          LATEST="ghcr.io/kettleofketchup/authentik-operator:latest"
          docker build -t $TAG -f Dockerfile .
          docker tag $TAG $VTAG
          docker tag $TAG $LATEST
          docker push $TAG
          docker push $VTAG
          docker push $LATEST

  helm:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push Helm chart
        run: |
          helm package chart/
          helm push authentik-operator-*.tgz oci://ghcr.io/kettleofketchup

  release:
    runs-on: ubuntu-latest
    needs: [docker, helm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Package Helm chart for release
        run: helm package chart/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: authentik-operator-*.tgz
