{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "authentik-operator.fullname" . }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik-operator.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "authentik-operator.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "authentik-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --bootstrap
            - --authentik-url={{ required "authentik.url is required" .Values.authentik.url }}
            {{- include "authentik-operator.tls-args" . | nindent 12 }}
          env:
            - name: AUTHENTIK_URL
              value: {{ required "authentik.url is required" .Values.authentik.url | quote }}
            - name: AUTHENTIK_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authentik.bootstrapSecretRef }}
                  key: {{ .Values.authentik.bootstrapSecretKey }}
            - name: TOKEN_SECRET_NAME
              value: {{ .Values.tokenSecretName | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{- include "authentik-operator.tls-volumemounts" . | nindent 12 }}
      {{- if or .Values.authentik.tls.caSecretRef .Values.authentik.tls.caConfigMapRef }}
      volumes:
        {{- include "authentik-operator.tls-volumes" . | nindent 8 }}
      {{- end }}
{{- end }}
